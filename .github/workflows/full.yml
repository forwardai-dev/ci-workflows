name: full-quality-security

# Reusable CI "swarm" — the full ForwardAI code-standards + security gate, callable from
# any repo with one `uses:` line. Mirrors the praxis §II-B controls (SAST, secrets, deps,
# types, coverage) as CONTINUOUS enforcement. See README for the caller snippet.
#
# v1.1: adds install-command / test-command / cov-command inputs and makes pyproject-
# dependent steps optional, so repos with non-standard layouts (app/, app/backend, flat)
# can adopt the gate without restructuring. Defaults are byte-identical to v1 behaviour,
# so existing callers (e.g. aah) are unaffected.
#
# Every scanner version is pinned so a stricter upstream release can't silently break callers.

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions for the test matrix'
        type: string
        default: '["3.11", "3.12", "3.13"]'
      src-paths:
        description: 'Space-separated source paths to lint/scan'
        type: string
        default: 'src'
      lint-paths:
        description: 'Space-separated paths for ruff (lint + format check)'
        type: string
        default: 'src tests'
      package-name:
        description: 'Import package name for coverage (e.g. aah). Empty disables the coverage gate.'
        type: string
        default: ''
      install-command:
        description: 'How to install the project + its deps (v1.1). Default assumes a root [dev] extra.'
        type: string
        default: 'pip install -e ".[dev]"'
      test-command:
        description: 'How to run the test suite (v1.1).'
        type: string
        default: 'PYTHONPATH=src python -m pytest tests/ -q'
      cov-command:
        description: 'Coverage gate command (v1.1). Empty falls back to the package-name default.'
        type: string
        default: ''
      pyproject-path:
        description: 'Path to pyproject.toml for bandit/interrogate/validate (v1.1). Steps skip if absent.'
        type: string
        default: 'pyproject.toml'
      coverage-min:
        description: 'Minimum test coverage %% (gate). 0 disables.'
        type: number
        default: 90
      pylint-min:
        description: 'Minimum pylint score (gate). 0 disables.'
        type: number
        default: 9.0
      docstring-min:
        description: 'Minimum interrogate docstring coverage %% (gate). 0 disables.'
        type: number
        default: 80
      run-docs-sync:
        description: 'Run scripts/check_docs_sync.py if the repo ships one'
        type: boolean
        default: false
      pin-python:
        description: 'Python version for the single-run quality job'
        type: string
        default: '3.12'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: ${{ inputs.install-command }}
      - run: ${{ inputs.test-command }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ inputs.pin-python }}" }
      - name: Install (project + pinned scanners)
        run: |
          ${{ inputs.install-command }}
          pip install bandit interrogate pip-audit build twine "validate-pyproject[all]" "semgrep==1.171.0" "pyright==1.1.411" "pylint==4.0.6"

      - name: Lint (ruff)
        run: ruff check ${{ inputs.lint-paths }} && ruff format --check ${{ inputs.lint-paths }}
      - name: Lint (pylint gate)
        if: ${{ inputs.pylint-min != 0 }}
        run: pylint ${{ inputs.src-paths }} --fail-under=${{ inputs.pylint-min }}
      - name: Types (mypy)
        run: mypy ${{ inputs.src-paths }}
      - name: Types (pyright)
        run: pyright ${{ inputs.src-paths }}

      - name: SAST (bandit)
        run: |
          if [ -f "${{ inputs.pyproject-path }}" ]; then
            bandit -r ${{ inputs.src-paths }} -c "${{ inputs.pyproject-path }}"
          else
            bandit -r ${{ inputs.src-paths }}
          fi
      - name: SAST (semgrep)
        run: semgrep --config=auto --error --quiet ${{ inputs.lint-paths }}
      - name: Secrets (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          CFG=""; [ -f .gitleaks.toml ] && CFG="--config .gitleaks.toml"
          ./gitleaks detect --source . $CFG --redact

      - name: Coverage gate
        if: ${{ inputs.package-name != '' && inputs.coverage-min != 0 }}
        run: |
          if [ -n "${{ inputs.cov-command }}" ]; then
            ${{ inputs.cov-command }}
          else
            PYTHONPATH=src python -m pytest tests -q --cov=${{ inputs.package-name }} --cov-fail-under=${{ inputs.coverage-min }}
          fi
      - name: Docstring coverage
        if: ${{ inputs.docstring-min != 0 }}
        run: |
          if [ -f "${{ inputs.pyproject-path }}" ] && grep -q "tool.interrogate" "${{ inputs.pyproject-path }}"; then
            interrogate -c "${{ inputs.pyproject-path }}" ${{ inputs.src-paths }}
          else
            interrogate ${{ inputs.src-paths }} -f ${{ inputs.docstring-min }}
          fi

      - name: Dependency vulns (osv-scanner)
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/download/v1.9.1/osv-scanner_linux_amd64 -o osv-scanner && chmod +x osv-scanner
          ./osv-scanner scan --recursive .
      - name: Dependency audit (pip-audit, advisory)
        run: pip-audit || true

      - name: SBOM (syft — CycloneDX artifact, praxis P15 parity)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /tmp/bin
          /tmp/bin/syft dir:. -o cyclonedx-json=sbom.cyclonedx.json -q
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cyclonedx.json }

      - name: Docs-vs-repo sync
        if: ${{ inputs.run-docs-sync }}
        run: PYTHONPATH=src python scripts/check_docs_sync.py
      - name: Packaging metadata
        if: ${{ inputs.pyproject-path != '' }}
        run: |
          if [ -f "${{ inputs.pyproject-path }}" ]; then validate-pyproject "${{ inputs.pyproject-path }}"; else echo "no pyproject — skipping"; fi
